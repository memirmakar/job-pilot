<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --page: #0e1013; --panel: #16191e; --raised: #1d2128; --hover: #232832;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.14);
    --text: #eceef1; --text-2: #b4bac4; --muted: #8a919d;
    --accent: #3987e5; --accent-text: #7fb2f0; --accent-soft: rgba(57,135,229,.16);
    --track: #262b33; --grid: #2a2f37;
    /* status: always paired with a text label */
    --good: #3ecf5a; --good-bg: rgba(12,163,12,.16);
    --warn: #fab219; --warn-bg: rgba(250,178,25,.14);
    --serious: #ec835a; --serious-bg: rgba(236,131,90,.15);
    --bad: #f07171; --bad-bg: rgba(208,59,59,.18);
    --neutral-bg: rgba(255,255,255,.07);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text); }
  body { font: 14px/1.55 Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { text-decoration: underline; }
  b, strong { color: var(--text); font-weight: 600; }
  code { background: var(--raised); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }

  /* ---------- top bar ---------- */
  header { position: sticky; top: 0; z-index: 10; background: rgba(14,16,19,.88); backdrop-filter: blur(10px);
           border-bottom: 1px solid var(--border); }
  .bar { max-width: 1440px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 28px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .2px; white-space: nowrap; flex: none; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #3987e5, #199e70); display: grid; place-items: center; }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  nav::-webkit-scrollbar { display: none; }
  nav button { background: none; border: 0; color: var(--text-2); font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  nav button:hover { background: var(--hover); color: var(--text); }
  nav button.on { background: var(--accent-soft); color: var(--accent-text); }
  .bar .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

  main { max-width: 1440px; margin: 0 auto; padding: 24px; }
  @media (max-width: 760px) { main { padding: 16px; } .bar { padding: 0 16px; gap: 14px; } .bar .meta { display: none; } }

  /* ---------- building blocks ---------- */
  .grid { display: grid; gap: 16px; }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .g4, .g2 { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
  .card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
  .card h3 .count { color: var(--muted); font-weight: 500; }
  .section-title { font-size: 18px; font-weight: 700; margin: 32px 0 14px; display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
  .section-title small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .muted { color: var(--muted); }
  .sub { color: var(--text-2); font-size: 13px; }
  .stack > * + * { margin-top: 12px; }

  .tile .v { font-size: 30px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; }
  .tile .l { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .tile .s { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .p-good { background: var(--good-bg); color: var(--good); }
  .p-warn { background: var(--warn-bg); color: var(--warn); }
  .p-serious { background: var(--serious-bg); color: var(--serious); }
  .p-bad { background: var(--bad-bg); color: var(--bad); }
  .p-neutral { background: var(--neutral-bg); color: var(--text-2); }
  .p-accent { background: var(--accent-soft); color: var(--accent-text); }
  .tag { display: inline-block; font-size: 12px; color: var(--text-2); background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; }
  .chip.y { background: var(--good-bg); color: var(--good); }
  .chip.n { background: var(--bad-bg); color: var(--bad); }
  .chip.more { background: var(--neutral-bg); color: var(--muted); }

  .callout { border-radius: var(--radius); padding: 14px 16px; border: 1px solid; display: flex; gap: 12px; align-items: flex-start; }
  .callout .ico { font-size: 16px; line-height: 1.4; }
  .callout.bad { background: var(--bad-bg); border-color: rgba(240,113,113,.35); }
  .callout.warn { background: var(--warn-bg); border-color: rgba(250,178,25,.35); }
  .callout.info { background: var(--accent-soft); border-color: rgba(57,135,229,.35); }

  .rich ul { margin: 4px 0; padding-left: 18px; }
  .rich li { margin: 3px 0; color: var(--text-2); }
  .rich li::marker { color: var(--muted); }
  .rich p { margin: 4px 0; color: var(--text-2); }

  /* ---------- charts ---------- */
  .hbars { display: grid; gap: 9px; }
  .hbar { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 44px; align-items: center; gap: 10px; font-size: 13px; }
  .hbar .lab { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .trk { height: 10px; background: var(--track); border-radius: 5px; position: relative; }
  .hbar .fill { height: 100%; border-radius: 5px; background: var(--accent); min-width: 2px; }
  .hbar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; }
  .hbar:hover .lab { color: var(--text); }
  .hbar .marker { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-2); border-radius: 1px; }

  .hist { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding-top: 8px; position: relative; }
  .hist .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
  .hist .b { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; }
  .hist .b.low { background: #4a5260; }
  .hist .n { font-size: 11px; color: var(--text-2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .hist-axis { display: flex; gap: 4px; border-top: 1px solid var(--grid); padding-top: 4px; }
  .hist-axis span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hist .thr { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--warn); }
  .hist .thr span { position: absolute; top: -2px; left: 6px; font-size: 11px; color: var(--warn); white-space: nowrap; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  .funnel { display: grid; gap: 8px; }
  .funnel .row { display: grid; grid-template-columns: 150px 1fr 70px; gap: 12px; align-items: center; font-size: 13px; }
  .funnel .seg { height: 26px; border-radius: 6px; background: var(--accent); opacity: var(--o, 1); display: flex; align-items: center; padding-left: 10px; color: #fff; font-weight: 600; font-size: 12px; min-width: 32px; }
  .funnel .pct { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { .funnel .row { grid-template-columns: 100px 1fr 50px; } }

  #tip { position: fixed; pointer-events: none; z-index: 50; background: #0b0d10; border: 1px solid var(--border-strong); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; max-width: 320px; }

  .gauge { width: 76px; height: 76px; flex: none; }
  .gauge text { fill: var(--text); font: 700 20px Inter, system-ui, sans-serif; }

  /* ---------- to-do ---------- */
  .todo { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
  @media (max-width: 760px) { .todo { grid-template-columns: 28px minmax(0, 1fr); gap: 10px; } .todo .rank { width: 28px; height: 28px; } .card { padding: 14px; } }
  .todo .rank { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 700; }
  .todo.done { opacity: .5; }
  .todo.done .t { text-decoration: line-through; }
  .todo .t { font-weight: 600; font-size: 15px; }
  .todo ol { margin: 6px 0; padding-left: 20px; color: var(--text-2); }
  .todo ol li { margin: 3px 0; }
  .todo .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; margin-top: 8px; }
  .todo .facts dd { overflow-wrap: anywhere; }
  @media (max-width: 500px) { .todo .facts { grid-template-columns: 1fr; } .todo .facts dd { margin-bottom: 6px; } }
  .todo .facts dt { color: var(--muted); }
  .todo .facts dd { margin: 0; color: var(--text-2); }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  /* ---------- applications view ---------- */
  .apps { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .apps { grid-template-columns: 1fr; } }
  .list { padding: 0; overflow: hidden; position: sticky; top: 76px; }
  @media (max-width: 1000px) { .list { position: static; } }
  .list .tools { padding: 14px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
  .search { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--raised); color: var(--text); font: inherit; }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button { border: 1px solid var(--border-strong); background: transparent; color: var(--text-2); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .items { max-height: calc(100vh - 260px); overflow-y: auto; }
  .item { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  .item:hover { background: var(--hover); }
  .item.sel { background: var(--raised); box-shadow: inset 3px 0 0 var(--accent); }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .c { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sc { grid-row: span 2; align-self: center; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .item .sc small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }

  .head { display: flex; gap: 18px; align-items: center; }
  .head h2 { margin: 0; font-size: 21px; letter-spacing: -.2px; }
  .head .who { color: var(--text-2); margin-top: 2px; }
  .head .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

  details.card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .15s; }
  details.card:not([open]) > summary::after { transform: rotate(-90deg); }
  details.card[open] > summary { margin-bottom: 14px; }

  .resume-row { padding: 12px 0; border-top: 1px solid var(--border); }
  .resume-row:first-child { border-top: 0; padding-top: 0; }
  .resume-row .top { display: grid; grid-template-columns: 1fr 160px 34px; gap: 12px; align-items: center; }
  .resume-row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resume-row.best .name { color: var(--accent-text); }
  .resume-row details { margin-top: 6px; }
  .resume-row summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }

  .qa { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 4px 20px; padding: 12px 0; border-top: 1px solid var(--border); }
  .qa:first-child { border-top: 0; padding-top: 0; }
  .qa .q { font-weight: 500; }
  .qa .a { color: var(--text); font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qa .r { grid-column: 1 / -1; font-size: 13px; }
  @media (max-width: 760px) { .qa { grid-template-columns: 1fr; } }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 1200px) { .compare { grid-template-columns: 1fr; } }
  .compare iframe { width: 100%; height: 620px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .compare .cap { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; gap: 8px; }
  pre.jd { white-space: pre-wrap; font: inherit; color: var(--text-2); margin: 0; max-height: 460px; overflow: auto; }

  table.log { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.log th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); position: sticky; top: 60px; background: var(--panel); }
  table.log td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.log tr:hover td { background: var(--hover); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .repo-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .repo-head a { font-weight: 600; font-size: 15px; }

  /* ---------- buttons & forms ---------- */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--raised); color: var(--text); font: inherit; font-weight: 500;
         padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--hover); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 4px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form { display: grid; gap: 16px; }
  .field { display: grid; gap: 6px; }
  .field > label { font-weight: 600; font-size: 13px; }
  .field .hint { color: var(--muted); font-size: 12.5px; }
  input[type=text], input[type=time], input[type=number], textarea, select {
    width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--raised); color: var(--text); font: inherit; }
  textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .row2 { grid-template-columns: 1fr; } }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; }
  .drop { border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--text-2); cursor: pointer; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- run status in the top bar ---------- */
  .runbar { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
  .runpill { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 8px; max-width: 320px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--good); box-shadow: 0 0 0 0 rgba(62,207,90,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(62,207,90,0); } 100% { box-shadow: 0 0 0 0 rgba(62,207,90,0); } }
  @media (max-width: 760px) { .runpill span.txt { display: none; } }
  pre.events { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--text-2); background: var(--raised); border-radius: 8px; padding: 10px 12px; margin: 0; max-height: 240px; overflow: auto; }

  /* ---------- onboarding ---------- */
  .wizard { max-width: 860px; margin: 0 auto; }
  .steps { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .steps span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--neutral-bg); color: var(--muted); }
  .steps span.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .steps span.done { color: var(--good); }
  .wizard h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.3px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: -4px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0b0d10; border: 1px solid var(--border-strong); padding: 10px 16px; border-radius: 10px; z-index: 60; display: none; max-width: 90vw; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>Job Pilot</div>
    <nav id="nav">
      <button data-v="overview">Overview</button>
      <button data-v="apps">Jobs</button>
      <button data-v="resumes">Resumes</button>
      <button data-v="github">GitHub</button>
      <button data-v="log">Activity</button>
      <button data-v="doctor">Doctor</button>
      <button data-v="settings">Settings</button>
    </nav>
    <div class="runbar" id="runbar"></div>
  </div>
</header>
<main id="view"></main>
<div id="tip"></div>
<div id="toast"></div>

<script>
// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Inline: escape + **bold**
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const fmtDate = (s) => s ? new Date(s).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
const usd = (u) => u?.costUsd ?? 0;
const finalScore = (r) => r.tailored?.used ? r.tailored.score : r.ats?.best_score;
let META = { minAtsScore: 55, tailorTarget: 80 };

// Turns Claude's text into scannable HTML: "- " lines become bullets, **x** becomes bold,
// and long plain paragraphs are split into one bullet per sentence.
function rich(text) {
  if (!text) return "";
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  let lines = String(text).split(/\n+/).map((l) => l.trim()).filter(Boolean);
  if (lines.length === 1 && !lines[0].startsWith("- ") && lines[0].length > 180)
    lines = lines[0].split(/(?<=[.!?])\s+(?=[A-ZÇĞİÖŞÜ0-9"'(])/).map((s) => "- " + s);
  const bullets = lines.filter((l) => /^[-•*]\s/.test(l));
  if (!bullets.length) return `<div class="rich"><p>${inline(lines.join(" "))}</p></div>`;
  return `<div class="rich">${lines.filter((l) => !/^[-•*]\s/.test(l)).map((l) => `<p>${inline(l)}</p>`).join("")}<ul>${bullets.map((l) => `<li>${inline(l.replace(/^[-•*]\s/, ""))}</li>`).join("")}</ul></div>`;
}

const STATUS = {
  applied: ["Applied", "p-good"], dry_run: ["Dry run", "p-neutral"], resume_insufficient: ["Resume too weak", "p-serious"],
  needs_manual: ["Needs manual", "p-warn"], skipped_by_user: ["Skipped", "p-neutral"], in_progress: ["In progress", "p-warn"],
  error: ["Error", "p-bad"], filtered: ["Filtered", "p-neutral"], parse_error: ["Couldn't read page", "p-warn"],
  no_easy_apply: ["No Easy Apply", "p-neutral"], already_applied: ["Already applied", "p-neutral"],
  external: ["Apply externally", "p-accent"], ready_to_apply: ["Ready to apply", "p-accent"], not_selected: ["Not picked", "p-neutral"],
  closed: ["Closed", "p-neutral"],
};
const ago = (iso) => {
  if (!iso) return "";
  const d = (Date.now() - Date.parse(iso)) / 864e5;
  return d < 1 ? "today" : d < 2 ? "1 day ago" : d < 14 ? `${Math.round(d)} days ago` : d < 60 ? `${Math.round(d / 7)} weeks ago` : `${Math.round(d / 30)} months ago`;
};
const toast = (msg, ms = 4000) => { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), ms); };
const api = async (url, body) => {
  const r = await fetch(url, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
};
const pill = (s) => { const [l, c] = STATUS[s] || [s, "p-neutral"]; return `<span class="pill ${c}">${esc(l)}</span>`; };
const LEVEL = { high: "p-good", medium: "p-warn", low: "p-neutral", strong: "p-good", moderate: "p-warn", weak: "p-bad" };
const lvl = (v, prefix = "") => `<span class="pill ${LEVEL[v] || "p-neutral"}">${esc(prefix + v)}</span>`;
const VERDICT = { real_value: ["Real value", "p-good"], moderate: ["Moderate", "p-warn"], ats_padding: ["ATS padding only", "p-bad"], not_relevant: ["Not relevant", "p-neutral"] };
const verdict = (v) => { const [l, c] = VERDICT[v] || [v, "p-neutral"]; return `<span class="pill ${c}">${esc(l)}</span>`; };
const chips = (arr, cls, max = 10) => !arr?.length ? "" :
  `<div class="chips">${arr.slice(0, max).map((k) => `<span class="chip ${cls}">${esc(String(k).replace(/\*\*/g, ""))}</span>`).join("")}${arr.length > max ? `<span class="chip more">+${arr.length - max} more</span>` : ""}</div>`;

// Score gauge: ring fill = score/100, colored by pass/fail against the threshold (number always shown)
function gauge(score, size = 76) {
  const r = 30, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, score || 0));
  const color = v >= (META.tailorTarget || 80) ? "var(--good)" : v >= META.minAtsScore ? "var(--accent)" : "var(--serious)";
  return `<svg class="gauge" viewBox="0 0 76 76" width="${size}" height="${size}" role="img" aria-label="ATS score ${v}">
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--track)" stroke-width="7"/>
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${(v / 100) * c} ${c}" transform="rotate(-90 38 38)"/>
    <text x="38" y="45" text-anchor="middle">${v}</text></svg>`;
}

function hbars(items, { max, marker } = {}) {
  const m = max ?? Math.max(1, ...items.map((i) => i.value));
  return `<div class="hbars">${items.map((i) => `
    <div class="hbar" data-tip="${esc(i.tip || `${i.label}: ${i.display ?? i.value}`)}">
      <div class="lab">${esc(i.label)}</div>
      <div class="trk"><div class="fill" style="width:${(i.value / m) * 100}%;${i.color ? `background:${i.color}` : ""}"></div>
        ${marker != null ? `<div class="marker" style="left:${(marker / m) * 100}%"></div>` : ""}</div>
      <div class="val">${esc(i.display ?? i.value)}</div>
    </div>`).join("")}</div>`;
}

let DATA = [], LOG = [], MARKET = null, DONE = {}, GH = null, AUDIT = {}, STATS = null;
const SKILL_KINDS = new Set(["skill", "tool", "domain_knowledge", "certification"]);
const KIND = { location: "Location", travel: "Travel", military: "Military", driving_license: "License", language: "Language", education: "Education", experience: "Experience", soft_skill: "Soft skill", generic_duty: "Generic duty", noise: "Not a skill" };
// Splits a job's raw "missing" keywords using the cached sanity audit
function splitMissing(x) {
  const skills = new Map(), other = new Map();
  for (const k of [...(x.missing_keywords || []), ...(x.unmet_requirements || [])]) {
    const a = AUDIT[String(k).replace(/[İIı]/g, "i").toLowerCase().trim()];
    if (!a) { skills.set(k, { canonical: k }); continue; }
    if (SKILL_KINDS.has(a.kind) && !a.satisfied_by_profile) skills.set(a.canonical, a);
    else other.set(a.canonical, a);
  }
  return { skills: [...skills.values()], other: [...other.values()] };
}

    </div>

}

function detailHtml(r) {
  if (!r) return `<div class="card empty">Select an application</div>`;
  const resumes = [...(r.ats?.resumes || [])].sort((a, b) => b.ats_score - a.ats_score);
  const fields = (r.steps || []).flatMap((s) => s.fields);
  const claudeFields = fields.filter((f) => f.source === "claude");
  return `<div class="stack">
    <div class="card"><div class="head">${gauge(finalScore(r))}
      <div style="min-width:0"><h2>${esc(r.title)}</h2>
        <div class="who">${esc(r.company)}${r.location ? " · " + esc(r.location) : ""}</div>
        <div class="row">${pill(r.status)}${r.archived ? `<span class="pill p-neutral">Archived</span>` : ""}
          ${r.easyApply === false ? `<span class="pill p-accent">External application</span>` : r.easyApply ? `<span class="pill p-neutral">Easy Apply</span>` : ""}
          ${r.tailored?.used ? `<span class="pill p-accent">Tailored ${r.tailored.baseScore} → ${r.tailored.score}</span>` : ""}
          ${r.field ? `<span class="tag">${esc(r.field)}</span>` : ""}</div>
        <div class="row">
          ${r.postedAt ? `<span class="tag" data-tip="${esc(r.postedText || "")}">Posted ${esc(fmtDate(r.postedAt).split(",")[0])} (${ago(r.postedAt)})</span>` : r.postedText ? `<span class="tag">${esc(r.postedText)}</span>` : ""}
          ${r.applicants ? `<span class="tag">${esc(r.applicants)}</span>` : ""}
          <span class="tag">${r.submittedAt ? "Applied" : "Analyzed"} ${fmtDate(r.submittedAt || r.createdAt)}</span><span class="tag">usage $${usd(r.usage).toFixed(2)}</span></div>
        ${r.statusReason ? `<div class="sub" style="margin-top:6px">${esc(r.statusReason)}</div>` : ""}
        <div class="btns" style="margin-top:10px">
          ${r.externalUrl ? `<a class="btn sm primary" href="${esc(r.externalUrl)}" target="_blank" rel="noopener">Apply on company site ↗</a>` : ""}
          <a class="btn sm" href="${esc(r.url)}" target="_blank" rel="noopener">Open on LinkedIn ↗</a>
          ${r.tailored?.path ? `<a class="btn sm ${["external", "ready_to_apply", "resume_insufficient"].includes(r.status) ? "primary" : ""}" href="${pdfUrl(r.tailored.used ? r.tailored.path : (r.tailored.basePath || "resumes/" + r.tailored.baseFile))}&dl=1">Download the resume to send</a>` : ""}
          <button class="btn sm" data-action="archive" data-site="${esc(r.site)}" data-id="${esc(r.id)}" data-v="${r.archived ? "" : "1"}">${r.archived ? "Unarchive" : "Archive"}</button>
        </div></div></div></div>

    ${r.archived ? `<div class="callout info"><div class="ico">🗄</div><div><b>Archived ${fmtDate(r.archived.at)}</b>: ${esc(r.archived.reason)}. Everything below is kept.</div></div>` : ""}
    ${["external", "ready_to_apply"].includes(r.status) && !r.archived ? `<div class="callout info"><div class="ico">→</div><div><b>To apply:</b> download the resume above, then open the listing on LinkedIn and click
      ${r.status === "external" ? "<b>Apply</b> (it continues on the company's site)" : "<b>Easy Apply</b>"}. Claude's notes below help with the questions.</div></div>` : ""}

    ${(r.warnings || []).map((w) => `<div class="callout warn"><div class="ico">⚠</div><div>${esc(w)}</div></div>`).join("")}

    <details class="card" open><summary>Resume match</summary>
      ${r.ats?.summary ? `<div style="margin-bottom:14px">${rich(r.ats.summary)}</div>` : ""}
      ${resumes.map((x) => `<div class="resume-row ${x.file === r.ats.best_file ? "best" : ""}">
        <div class="top"><div class="name">${esc(x.file)} ${x.file === r.ats.best_file ? `<span class="pill p-accent">best</span>` : ""}</div>
          <div class="trk" style="height:8px;background:var(--track);border-radius:4px"><div style="height:100%;border-radius:4px;width:${x.ats_score}%;background:${x.file === r.ats.best_file ? "var(--accent)" : "#4a5260"}"></div></div>
          <div style="text-align:right;font-weight:700">${x.ats_score}</div></div>
        <details><summary>Keywords & reasoning</summary><div style="margin-top:8px" class="stack">
          ${x.matched_keywords?.length ? `<div><div class="muted" style="font-size:12px;margin-bottom:4px">MATCHED</div>${chips(x.matched_keywords, "y", 14)}</div>` : ""}
          ${(() => { const m = splitMissing(x); return `
            ${m.skills.length ? `<div><div class="muted" style="font-size:12px;margin-bottom:4px">MISSING SKILLS</div>${chips(m.skills.map((a) => a.canonical), "n", 14)}</div>` : ""}
            ${m.other.length ? `<div><div class="muted" style="font-size:12px;margin-bottom:4px">OTHER REQUIREMENTS (NOT SKILLS)</div><div class="chips">${m.other.map((a) =>
              `<span class="chip ${a.satisfied_by_profile ? "y" : "more"}" data-tip="${esc(a.note || "")}">${a.satisfied_by_profile ? "✓ " : ""}${esc(a.canonical)} · ${esc(KIND[a.kind] || a.kind)}</span>`).join("")}</div></div>` : ""}`; })()}
          ${rich(x.reasoning)}</div></details>
      </div>`).join("") || `<div class="muted">Not scored</div>`}
    </details>

    ${tailoredHtml(r)}
    ${recsHtml(r)}
    ${githubJobHtml(r)}

    <details class="card" ${claudeFields.length ? "open" : ""}><summary>Questions & answers <span class="muted" style="text-transform:none;letter-spacing:0">· ${claudeFields.length} by Claude, ${fields.length - claudeFields.length} prefilled</span></summary>
      ${fields.length ? fields.map((f) => `<div class="qa">
        <div class="q">${esc(f.label || "(unlabelled field)")}</div>
        <div class="a">${esc(f.source === "prefilled" ? "(filled by LinkedIn)" : f.value) || "<i class='muted'>blank</i>"}</div>
        ${f.source === "claude" ? `<div class="r"><span class="pill ${f.confidence === "low" ? "p-bad" : f.confidence === "medium" ? "p-warn" : "p-good"}">${esc(f.confidence)} confidence</span> <span class="sub">${md(f.reasoning)}</span></div>` : ""}
        ${f.error ? `<div class="r" style="color:var(--bad)">Couldn't fill: ${esc(f.error)}</div>` : ""}
      </div>`).join("") : `<div class="muted">No questions answered${r.status === "resume_insufficient" ? " (skipped before applying)" : ""}</div>`}
    </details>

    <details class="card"><summary>Job description</summary><pre class="jd">${esc(r.description)}</pre></details>
  </div>`;
}

const pdfUrl = (p) => "/pdf?p=" + encodeURIComponent(p);
function tailoredHtml(r) {
  const t = r.tailored; if (!t) return "";
  const status = !t.used ? "Not used: it didn't beat the original" : t.uploaded === true ? "Uploaded to LinkedIn and used"
    : t.uploaded === false ? "Upload failed, the original was used" : r.status === "resume_insufficient" ? "Not sent (job skipped)" : "Selected for this application";
  const added = t.resume?.github_added || [];
  return `<details class="card" open><summary>Tailored resume</summary>
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:6px">${gauge(t.baseScore, 58)}<span style="font-size:20px;color:var(--muted)">→</span>${gauge(t.score, 58)}</div>
      <div><div style="font-weight:600">${t.score - t.baseScore >= 0 ? "+" : ""}${t.score - t.baseScore} ATS points · ${t.pass} pass${t.pass > 1 ? "es" : ""}</div><div class="sub">${esc(status)}</div></div></div>
    <div class="grid g2">
      <div><div class="muted" style="font-size:12px;margin-bottom:6px">WHAT CHANGED</div>
        <div class="rich"><ul>${(t.resume?.changes || []).map((c) => `<li><b>${md(c.what)}</b><br><span class="sub">${md(c.why)}</span></li>`).join("")}</ul></div></div>
      <div class="stack">
        ${t.resume?.not_added?.length ? `<div><div class="muted" style="font-size:12px;margin-bottom:6px">NOT ADDED: YOUR RESUMES DON'T SUPPORT IT</div>${chips(t.resume.not_added.map((s) => s.split(":")[0]), "n", 16)}</div>` : ""}
        ${added.length ? `<div><div class="muted" style="font-size:12px;margin-bottom:6px">GITHUB PROJECTS ADDED</div><div class="rich"><ul>${added.map((a) => `<li>${verdict(a.verdict)} <b>${esc(a.repo)}</b>: ${md(a.note)}</li>`).join("")}</ul></div></div>` : ""}
      </div></div>
    <div class="compare" style="margin-top:16px">
      <div><div class="cap"><span>Original · <b>${esc(t.baseFile)}</b> (${t.baseScore})</span><a href="${pdfUrl(t.basePath || "resumes/" + t.baseFile)}" target="_blank" rel="noopener">Open ↗</a></div>
        <iframe src="${pdfUrl(t.basePath || "resumes/" + t.baseFile)}" title="Original resume" loading="lazy"></iframe></div>
      <div><div class="cap"><span>Tailored · <b>${esc(t.file)}</b> (${t.score})</span><a href="${pdfUrl(t.path)}" target="_blank" rel="noopener">Open ↗</a></div>
        <iframe src="${pdfUrl(t.path)}" title="Tailored resume" loading="lazy"></iframe></div>
    </div></details>`;
}

const RECTYPE = { project: "Project", github: "GitHub", portfolio: "Portfolio", certification: "Certification", course: "Course", skill: "Skill", resume: "Resume", linkedin_profile: "LinkedIn", other: "Other" };
function recsHtml(r) {
  const recs = [...(r.ats?.recommendations || [])].sort((a, b) => b.estimated_gain - a.estimated_gain);
  if (!recs.length) return "";
  return `<details class="card" open><summary>Improve your chances for this job</summary>
    ${hbars(recs.map((x) => ({ label: `${RECTYPE[x.type] || x.type} · ${x.effort}`, value: x.estimated_gain, display: `+${x.estimated_gain}`, tip: x.action.slice(0, 160) })))}
    <div class="stack" style="margin-top:14px">${recs.map((x) => `<div style="border-top:1px solid var(--border);padding-top:12px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px"><span class="pill p-accent">+${x.estimated_gain} ATS</span><span class="tag">${RECTYPE[x.type] || esc(x.type)}</span><span class="tag">effort: ${esc(x.effort)}</span></div>
      ${rich(x.action)}<div class="sub">${rich(x.why)}</div></div>`).join("")}</div>
    <div class="sub" style="margin-top:12px">For the across-the-board list, see <a href="#overview" data-nav="overview">Overview → to-do list</a>.</div>
  </details>`;
}

function githubJobHtml(r) {
  const gp = r.ats?.github_projects || [];
  if (!gp.length) return "";
  const REC = { feature_on_resume: ["Feature on resume", "p-good"], mention_briefly: ["Mention briefly", "p-warn"], leave_off: ["Leave off", "p-neutral"] };
  return `<details class="card" open><summary>Your GitHub for this job</summary><div class="stack">
    ${gp.map((g) => { const [l, c] = REC[g.recommendation] || [g.recommendation, "p-neutral"]; return `<div style="border-top:1px solid var(--border);padding-top:12px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(g.repo)}</b><span class="pill ${c}">${l}</span><span class="tag">relevance ${g.relevance}/10</span></div>
      ${rich(g.honest_take)}<div class="sub">${rich(g.how_to_present)}</div></div>`; }).join("")}</div></details>`;
}

function renderGithub() {
  const order = { real_value: 0, moderate: 1, ats_padding: 2, not_relevant: 3 };
  const repos = [...(GH?.repos || [])].sort((a, b) => (order[a.review?.verdict] ?? 9) - (order[b.review?.verdict] ?? 9));
  const counts = repos.reduce((m, r) => ((m[r.review?.verdict] = (m[r.review?.verdict] || 0) + 1), m), {});
  $("#view").innerHTML = `
    <div class="section-title" style="margin-top:0">GitHub review <small>${esc(GH?.user || "no user set")}${GH?.fetchedAt ? " · fetched " + fmtDate(GH.fetchedAt) : ""} · refreshes every 4 days · <code>node apply.mjs github --refresh</code></small></div>
    <div class="grid g4">${Object.keys(VERDICT).map((v) => `<div class="card tile"><div class="v">${counts[v] || 0}</div><div class="l">${verdict(v)}</div></div>`).join("")}</div>
    <div class="stack" style="margin-top:16px">${repos.map((r) => { const v = r.review || {}; return `
      <div class="card"><div class="repo-head"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>${v.verdict ? verdict(v.verdict) : ""}
        <span class="tag">${r.commits} commits</span><span class="tag">${r.fileCount} files</span><span class="tag">${esc(Object.keys(r.languages).join(", ") || "no code")}</span></div>
        <div class="grid g2" style="margin-top:12px">
          <div><div class="muted" style="font-size:12px;margin-bottom:4px">WHAT IT IS</div>${rich(v.summary)}
            ${v.skills_demonstrated?.length ? `<div class="muted" style="font-size:12px;margin:10px 0 4px">SKILLS IT SHOWS</div>${chips(v.skills_demonstrated, "y", 12)}` : ""}</div>
          <div><div class="muted" style="font-size:12px;margin-bottom:4px">CRITIQUE</div>${rich(v.critique)}</div></div>
        <div style="margin-top:12px"><div class="muted" style="font-size:12px;margin-bottom:4px">TO MAKE IT VALUABLE</div>${rich(v.to_make_it_valuable)}</div>
        ${v.resume_line ? `<div class="callout info" style="margin-top:12px"><div class="ico">✎</div><div><b>Resume line:</b> ${md(v.resume_line)}</div></div>` : ""}

}

      </div>`).join("") || `<div class="card empty">${busy ? "Building your first ready resumes… this takes a few minutes per field." : "No ready resumes yet. Press <b>Update now</b>."}</div>`}</div>

    <div class="section-title">Your resumes <small>the source of every fact Claude uses · PDF, TXT or MD</small></div>
    <div class="card">
      <div class="drop" id="drop">Drop resume files here, or <b>click to choose</b><input type="file" id="file" accept=".pdf,.txt,.md" multiple hidden></div>
      <div class="stack" style="margin-top:14px">${STATE.resumes.map((r) => `
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(r.file)}</b>
          <span class="sub">${Math.round(r.size / 1024)} KB</span>
          ${r.file.toLowerCase().endsWith(".pdf") ? `<a class="btn sm" href="${pdfUrl(r.path)}" target="_blank" rel="noopener">View</a>` : ""}
          <button class="btn sm danger" data-action="remove-resume" data-file="${esc(r.file)}">Remove</button></div>`).join("") || `<div class="muted">No resumes yet.</div>`}</div>
    </div>`;
  bindDrop();
}
function bindDrop() {
  const drop = $("#drop"), input = $("#file");
  if (!drop) return;
  drop.onclick = () => input.click();
  input.onchange = () => uploadFiles(input.files);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); uploadFiles(e.dataTransfer.files); };
}
async function uploadFiles(list) {
  const files = await Promise.all([...list].map((f) => new Promise((res) => { const r = new FileReader(); r.onload = () => res({ name: f.name, data: String(r.result).split(",")[1] }); r.readAsDataURL(f); })));
  STATE.resumes = await api("/api/resumes", { files });
  toast(`Added ${files.length} file${files.length > 1 ? "s" : ""}`);
  render();
}

      <div class="field"><label>Your goals, in your words</label><textarea id="p-goals">${esc(p.preferences || p.goalsText || "")}</textarea></div>
      <div class="row2">
        <div class="field"><label>Locations <span class="hint">one per line, as you'd type them on LinkedIn</span></label><textarea id="p-locations" style="min-height:70px">${esc((p.locations || []).join("\n"))}</textarea></div>
        <div class="field"><label>Skip titles containing <span class="hint">one per line</span></label><textarea id="p-exclude" style="min-height:70px">${esc((p.titleExclude || []).join("\n"))}</textarea></div>
      </div>
      <div class="row2">
        <div class="field"><label>Seniority</label><input type="text" id="p-seniority" value="${esc(p.seniority || "")}"></div>
        <div class="field"><label>GitHub username</label><input type="text" id="p-github" value="${esc(p.githubUser || "")}" placeholder="optional"></div>
      </div>
      <div class="field"><label>Target fields</label><div class="stack" id="targets">${targetRows(p.targets || [])}</div>
        <div class="btns"><button class="btn sm" data-action="add-target">+ Add field</button></div></div>
      <div class="field"><label>Facts Claude may use in applications</label><textarea id="p-facts" style="min-height:150px">${esc(p.facts || "")}</textarea>
        <div class="hint">Contact details, languages, work authorization, notice period, salary hints… Anything not here or in your resumes, Claude decides to maximize your interview chances.</div></div>
      <div class="btns"><button class="btn primary" data-action="save-profile">Save</button></div>
    </div></div>

    <div class="section-title">How Job Pilot runs</div>
    <div class="card"><div class="form">
      <div class="row2">
        <div class="field"><label>Daily run</label><div class="btns"><label class="check"><input type="checkbox" id="s-sched" ${s.scheduleEnabled ? "checked" : ""}> Every day at</label><input type="time" id="s-time" value="${esc(s.scheduleTime)}" style="width:130px"></div>
          <div class="hint">${STATE.schedule.exists ? `Scheduled · next ${fmtDate(STATE.schedule.next)}` : "Not scheduled"}. Your PC must be on and you must be logged in to Windows.</div></div>
        <div class="field"><label>When a job has Easy Apply</label><select id="s-mode">${opt("auto", s.applyMode, "Apply automatically")}${opt("analyze_only", s.applyMode, "Only analyze and tailor; I'll apply myself")}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Jobs to analyze per day</label><input type="number" id="s-jobs" min="1" max="60" value="${s.dailyJobs}"></div>
        <div class="field"><label>Applications per day (max)</label><input type="number" id="s-apply" min="0" max="60" value="${s.dailyApplyLimit}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Claude for daily work</label><select id="s-mdaily">${opt("sonnet", s.modelDaily, "Sonnet (recommended: uses less of your plan)")}${opt("opus", s.modelDaily, "Opus (best quality, uses more)")}${opt("haiku", s.modelDaily, "Haiku (lightest)")}</select>
          <div class="hint">Picking, scoring, tailoring and answering questions.</div></div>
        <div class="field"><label>Claude for weekly work</label><select id="s-mweekly">${opt("opus", s.modelWeekly, "Opus (recommended)")}${opt("sonnet", s.modelWeekly, "Sonnet")}</select>
          <div class="hint">Ready resumes, market review, GitHub review, doctor.</div></div>
      </div>
      <div class="row2">
        <div class="field"><label>Don't apply below ATS score</label><input type="number" id="s-min" min="0" max="100" value="${s.minAtsScore}"></div>
        <div class="field"><label>Listings posted within</label><select id="s-posted">${opt("r86400", s.postedWithin, "24 hours")}${opt("r604800", s.postedWithin, "1 week")}${opt("r2592000", s.postedWithin, "1 month")}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Tailoring passes per job</label><select id="s-passes">${opt(1, s.tailorMaxPasses, "1 (less usage)")}${opt(2, s.tailorMaxPasses, "2 (higher scores)")}</select></div>
        <div class="field"><label>Stop a run after (minutes)</label><input type="number" id="s-maxmin" min="15" max="600" value="${s.maxRunMinutes}"></div>
      </div>
      <div class="btns"><button class="btn primary" data-action="save-settings">Save</button></div>
    </div></div>

    <div class="section-title">Accounts</div>
    <div class="card"><div class="stack">
      <div class="btns"><b style="min-width:160px">Claude Code CLI</b>
        ${STATE.claude?.found ? `<span class="pill ${STATE.claude.loggedIn ? "p-good" : "p-bad"}">${STATE.claude.loggedIn ? "Signed in" : "Not signed in"}</span><span class="sub">${esc(STATE.claude.path)}</span>` : `<span class="pill p-bad">Not found</span>`}
        <button class="btn sm" data-action="claude-login">Sign in</button><button class="btn sm" data-action="recheck">Check again</button></div>
      <div class="field"><label>Claude Code path <span class="hint">only if it isn't found automatically</span></label>
        <div class="btns"><input type="text" id="s-claudepath" value="${esc(s.claudePath || "")}" placeholder="C:\\Users\\you\\.local\\bin\\claude.exe" style="flex:1"><button class="btn sm" data-action="save-claudepath">Save</button></div></div>
      <div class="btns"><b style="min-width:160px">LinkedIn</b><button class="btn sm" data-action="linkedin-login">Open LinkedIn to sign in</button>
        <span class="sub">Signs in inside Job Pilot's own Edge profile. Close that window when you're done.</span></div>
    </div></div>

    <div class="section-title">App</div>
    <div class="card"><div class="btns"><button class="btn" data-action="dry-run">Test run (no submitting)</button>
      <button class="btn" data-action="task" data-task="review">Refresh market review</button>
      <button class="btn" data-action="task" data-task="github">Refresh GitHub</button>
      <button class="btn danger" data-action="quit">Quit Job Pilot</button></div>
      <div class="sub" style="margin-top:8px">Quitting closes this page's server; the daily run still happens on schedule. Open Job Pilot again from its desktop shortcut.</div></div>`;
}

// ---------- onboarding ----------
const OB = { step: 0, goals: "", locations: "", workplace: ["onsite", "hybrid", "remote"], seniority: "", extra: "", github: "", plan: null, busy: false, linkedinDone: false };
const OB_STEPS = ["Claude", "Resumes", "Goals", "Your plan", "LinkedIn", "Schedule"];
function renderOnboarding() {
  const st = OB.step, c = STATE.claude || {};
  const steps = `<div class="steps">${OB_STEPS.map((s, i) => `<span class="${i === st ? "on" : i < st ? "done" : ""}">${i < st ? "✓ " : ""}${i + 1}. ${s}</span>`).join("")}</div>`;
  const nav = (nextOk, nextLabel = "Next") => `<div class="btns" style="margin-top:18px">${st ? `<button class="btn" data-action="ob-back">Back</button>` : ""}
    <button class="btn primary" data-action="ob-next" ${nextOk ? "" : "disabled"}>${nextLabel}</button></div>`;
  let body = "";
  if (st === 0) body = `<h1>Welcome to Job Pilot</h1><p class="sub">Job Pilot finds jobs that fit you every day, tailors your resume for each one, applies where it can and explains every decision. It runs on <b>your own Claude Code</b> subscription.</p>
    <div class="card" style="margin-top:14px"><div class="stack">
      <div class="btns"><b>Claude Code CLI</b>${c.found ? `<span class="pill p-good">Found</span><span class="sub">${esc(c.path)}</span>` : `<span class="pill p-bad">Not found</span>`}</div>
      ${!c.found ? `<div class="sub">Install Claude Code from <a href="https://claude.com/claude-code" target="_blank" rel="noopener">claude.com/claude-code</a>, then press <b>Check again</b>.</div>` : ""}
      ${c.found ? `<div class="btns"><b>Signed in</b>${c.loggedIn ? `<span class="pill p-good">Yes</span>` : `<span class="pill p-bad">No</span> <button class="btn sm" data-action="claude-login">Sign in</button><span class="sub">A window opens: type <code>/login</code>, finish in the browser, close it.</span>`}</div>` : ""}
      <div><button class="btn sm" data-action="recheck">Check again</button></div></div></div>${nav(c.found && c.loggedIn)}`;
  if (st === 1) body = `<h1>Your resumes</h1><p class="sub">Add one or more. They're the only source of facts: Claude never invents experience. PDF works best.</p>
    <div class="card" style="margin-top:14px"><div class="drop" id="drop">Drop resume files here, or <b>click to choose</b><input type="file" id="file" accept=".pdf,.txt,.md" multiple hidden></div>
    <div class="stack" style="margin-top:12px">${STATE.resumes.map((r) => `<div class="btns"><b style="flex:1">${esc(r.file)}</b><button class="btn sm danger" data-action="remove-resume" data-file="${esc(r.file)}">Remove</button></div>`).join("")}</div></div>${nav(STATE.resumes.length)}`;
  if (st === 2) body = `<h1>What do you want to work on?</h1><p class="sub">Say it however you like. Claude turns it into searches.</p>
    <div class="card" style="margin-top:14px"><div class="form">
      <div class="field"><label>Your goals</label><textarea id="ob-goals" placeholder="e.g. I want to work in robotics or industrial automation, ideally hands-on with PLCs and embedded firmware. Junior roles. Not interested in sales.">${esc(OB.goals)}</textarea></div>
      <div class="row2"><div class="field"><label>Where?</label><textarea id="ob-loc" style="min-height:70px" placeholder="One per line: cities, countries or regions. e.g.&#10;Istanbul, Türkiye&#10;Germany&#10;Remote">${esc(OB.locations)}</textarea></div>
        <div class="field"><label>Workplace</label><div class="checks">${["onsite", "hybrid", "remote"].map((w) => `<label class="check"><input type="checkbox" data-wp="${w}" ${OB.workplace.includes(w) ? "checked" : ""}> ${w[0].toUpperCase() + w.slice(1)}</label>`).join("")}</div>
          <label style="margin-top:12px;font-weight:600;font-size:13px">Seniority</label><select id="ob-sen">${["", "Internship", "Entry level / new graduate", "Junior", "Mid-level", "Senior", "Lead / manager"].map((x) => `<option ${x === OB.seniority ? "selected" : ""} value="${esc(x)}">${x || "Let Claude decide from my resume"}</option>`).join("")}</select></div></div>
      <div class="row2"><div class="field"><label>GitHub username <span class="hint">optional</span></label><input type="text" id="ob-gh" value="${esc(OB.github)}"></div><div></div></div>
      <div class="field"><label>Anything employers might ask <span class="hint">optional</span></label><textarea id="ob-extra" placeholder="Phone, languages, work authorization, driving license, notice period, salary expectations…">${esc(OB.extra)}</textarea></div>
    </div></div>${nav(true, "Let Claude plan my search")}`;
  if (st === 3) body = OB.busy ? `<h1>Planning your search…</h1><div class="card" style="margin-top:14px"><span class="spinner"></span> Claude is reading your resumes and goals. This takes about a minute.</div>`
    : `<h1>Your search plan</h1><p class="sub">Edit anything. You can change it later in Settings.</p>
    ${OB.plan?.notes ? `<div class="callout info" style="margin-top:12px"><div class="ico">ℹ</div><div>${md(OB.plan.notes)}</div></div>` : ""}
    <div class="card" style="margin-top:14px"><div class="form">
      <div class="field"><label>Target fields</label><div class="stack" id="targets">${targetRows(OB.plan?.targets || [])}</div><div class="btns"><button class="btn sm" data-action="add-target">+ Add field</button></div></div>
      <div class="row2"><div class="field"><label>Locations</label><textarea id="pl-loc" style="min-height:70px">${esc((OB.plan?.locations || []).join("\n"))}</textarea></div>
        <div class="field"><label>Skip titles containing</label><textarea id="pl-ex" style="min-height:70px">${esc((OB.plan?.titleExclude || []).join("\n"))}</textarea></div></div>
      <div class="field"><label>Facts Claude may use in applications</label><textarea id="pl-facts" style="min-height:140px">${esc(OB.plan?.facts || "")}</textarea><div class="hint">Replace anything marked "unknown" if you can.</div></div>
    </div></div>${nav(true)}`;
  if (st === 4) body = `<h1>Sign in to LinkedIn</h1><p class="sub">Job Pilot uses its own Edge profile, so your normal browser isn't touched. Sign in once; it stays signed in.</p>
    <div class="card" style="margin-top:14px"><div class="stack"><div class="btns"><button class="btn primary" data-action="linkedin-login">Open LinkedIn</button><span class="sub">Sign in, then close that window.</span></div>
    <label class="check"><input type="checkbox" id="ob-li" ${OB.linkedinDone ? "checked" : ""}> I've signed in to LinkedIn</label>
    <div class="callout warn"><div class="ico">⚠</div><div>LinkedIn's terms don't allow automated applying. Keep the daily numbers modest; accounts that apply too much too fast can be restricted.</div></div></div></div>${nav(OB.linkedinDone)}`;
  if (st === 5) body = `<h1>When should it run?</h1>
    <div class="card" style="margin-top:14px"><div class="form">
      <div class="row2"><div class="field"><label>Every day at</label><input type="time" id="ob-time" value="${esc(STATE.settings.scheduleTime)}"></div>
        <div class="field"><label>Jobs to analyze per day</label><input type="number" id="ob-jobs" min="1" max="60" value="${STATE.settings.dailyJobs}"></div></div>
      <div class="field"><label>When a job has Easy Apply</label><select id="ob-mode"><option value="auto">Apply automatically</option><option value="analyze_only">Only analyze and tailor; I'll apply myself</option></select></div>
      <div class="field"><label>Claude usage</label><select id="ob-models"><option value="balanced">Balanced: Sonnet daily, Opus weekly (recommended)</option><option value="opus">Opus for everything (best, uses the most)</option><option value="sonnet">Sonnet for everything (lightest)</option></select>
        <div class="hint">Every job uses a few Claude calls (picking, scoring, tailoring, answering) from your plan.</div></div>
    </div></div>${nav(true, "Finish and start")}`;
  $("#view").innerHTML = `<div class="wizard">${steps}${body}</div>`;
  if (st === 1) bindDrop();
}
async function obNext() {
  const st = OB.step;
  if (st === 2) {
    OB.goals = $("#ob-goals").value.trim(); OB.locations = $("#ob-loc").value; OB.seniority = $("#ob-sen").value; OB.github = $("#ob-gh").value.trim(); OB.extra = $("#ob-extra").value;
    OB.workplace = [...document.querySelectorAll("[data-wp]")].filter((x) => x.checked).map((x) => x.dataset.wp);
    if (!OB.goals) return toast("Tell Claude what you want to work on first.");
    OB.step = 3; OB.busy = true; renderOnboarding();
    try { OB.plan = await api("/api/onboarding/plan", { goals: OB.goals, locations: lines(OB.locations), workplace: OB.workplace, seniority: OB.seniority, extra: OB.extra }); }
    catch (e) { OB.step = 2; toast(`Claude couldn't plan: ${e.message}`, 8000); }
    OB.busy = false; return renderOnboarding();
  }
  if (st === 3) Object.assign(OB.plan, { targets: readTargets(), locations: lines($("#pl-loc").value), titleExclude: lines($("#pl-ex").value), facts: $("#pl-facts").value });
  if (st === 5) {
    const models = { balanced: ["sonnet", "opus"], opus: ["opus", "opus"], sonnet: ["sonnet", "sonnet"] }[$("#ob-models").value];
    const p = OB.plan;
    await api("/api/onboarding/save", {
      profile: { name: p.name, goalsText: OB.goals, preferences: p.preferences || OB.goals, locations: p.locations, workplace: OB.workplace, seniority: p.seniority || OB.seniority,
        targets: p.targets, titleExclude: p.titleExclude, companyExclude: [], facts: p.facts, githubUser: OB.github || null },
      settings: { scheduleEnabled: true, scheduleTime: $("#ob-time").value, dailyJobs: Number($("#ob-jobs").value) || 20, applyMode: $("#ob-mode").value, modelDaily: models[0], modelWeekly: models[1] },
    });
    toast("All set. Claude is writing your ready resumes now; your first daily run starts on schedule (or press Run now).", 9000);
    view = "overview"; return load();
  }
  OB.step++; renderOnboarding();
}

// ---------- events ----------
const ACTIONS = {
  run: async () => { await api("/api/run", {}); toast("Run started. You'll see an Edge window working; leave it open."); await loadState(); },
  "dry-run": async () => { await api("/api/run", { dryRun: true, limit: 2 }); toast("Test run started on 2 jobs. Nothing will be submitted."); await loadState(); },
  stop: async () => { await api("/api/run/stop", {}); toast("Stopping the run…"); setTimeout(load, 1500); },
  task: async (el) => { await api("/api/task", { name: el.dataset.task }); toast(`${el.dataset.task} started`); await loadState(); render(); },
  doctor: async () => { await api("/api/doctor", { problem: $("#doc-problem")?.value || "" }); toast("Claude is checking the app. This can take several minutes."); await loadState(); render(); },
  restore: async (el) => { if (!confirm("Undo the doctor's changes from this report?")) return; await api("/api/doctor/restore", { id: el.dataset.id }); toast("Changes undone."); load(); },
  recheck: async () => { toast("Checking Claude…"); await loadState(true); render(); },
  "claude-login": async () => { await api("/api/login/claude", {}); toast("A Claude window opened: type /login, finish in your browser, close it, then press Check again.", 9000); },
  "linkedin-login": async () => { await api("/api/login/linkedin", {}); toast("An Edge window opened. Sign in to LinkedIn, then close it.", 8000); },
  "remove-resume": async (el) => { if (!confirm(`Remove ${el.dataset.file}? (It's moved to the data folder, not deleted.)`)) return; STATE.resumes = await api("/api/resumes/delete", { file: el.dataset.file }); render(); },
  archive: async (el) => { await api("/api/archive", { site: el.dataset.site, id: el.dataset.id, archived: !!el.dataset.v }); load(); },
  "add-target": () => {
    const box = $("#targets"); const list = view === "onboarding" ? (OB.plan.targets = readTargets()) : null;
    box.insertAdjacentHTML("beforeend", targetRows([{ field: "", searchTerms: [] }]).replace('data-target="0"', `data-target="${box.children.length}"`));
    if (list) OB.plan.targets = list;
  },
  "remove-target": (el) => el.closest("[data-target]").remove(),
  "save-profile": async () => {
    const targets = readTargets();
    if (!targets.length) return toast("Keep at least one target field with a search.");
    STATE.profile = await api("/api/profile", { preferences: $("#p-goals").value, locations: lines($("#p-locations").value), titleExclude: lines($("#p-exclude").value),
      seniority: $("#p-seniority").value, githubUser: $("#p-github").value.trim() || null, targets, facts: $("#p-facts").value });
    toast("Saved. Changes apply from the next run.");
  },
  "save-settings": async () => {
    const r = await api("/api/settings", { scheduleEnabled: $("#s-sched").checked, scheduleTime: $("#s-time").value, applyMode: $("#s-mode").value,
      dailyJobs: Number($("#s-jobs").value), dailyApplyLimit: Number($("#s-apply").value), modelDaily: $("#s-mdaily").value, modelWeekly: $("#s-mweekly").value,
      minAtsScore: Number($("#s-min").value), postedWithin: $("#s-posted").value, tailorMaxPasses: Number($("#s-passes").value), maxRunMinutes: Number($("#s-maxmin").value) });
    STATE.settings = r.settings;
    toast(r.schedule && String(r.schedule).startsWith("failed") ? `Saved, but scheduling failed: ${r.schedule}` : "Saved.");
    await loadState(); renderSettings();
  },
  "save-claudepath": async () => { await api("/api/settings", { claudePath: $("#s-claudepath").value.trim() || null }); await loadState(true); renderSettings(); },
  quit: async () => { if (!confirm("Quit Job Pilot? The scheduled daily run still happens.")) return; await api("/api/quit", {}); document.body.innerHTML = `<div class="empty">Job Pilot closed. Open it again from the desktop shortcut.</div>`; },
  "ob-next": () => obNext(),
  "ob-back": () => { OB.step = Math.max(0, OB.step - 1); renderOnboarding(); },
};

document.addEventListener("click", async (e) => {
  const act = e.target.closest("[data-action]");
  if (act && act.tagName !== "INPUT" && ACTIONS[act.dataset.action]) {
    e.preventDefault();
    try { await ACTIONS[act.dataset.action](act); } catch (err) { toast(err.message, 7000); }
    return;
  }
  const nav = e.target.closest("#nav button, [data-nav]");
  if (nav) { e.preventDefault(); view = nav.dataset.v || nav.dataset.nav; filter = "all"; location.hash = view; render(); window.scrollTo(0, 0); return; }
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; render(); return; }
  const item = e.target.closest(".item");
  if (item) { selected = item.dataset.k; render(); return; }
});
document.addEventListener("change", async (e) => {
  if (e.target.dataset.action === "toggle-archived") { showArchived = e.target.checked; filter = "all"; return render(); }
  if (e.target.id === "ob-li") { OB.linkedinDone = e.target.checked; return renderOnboarding(); }
  const cb = e.target.closest("[data-todo]");
  if (!cb) return;
  DONE = await fetch("/api/todo", { method: "POST", body: JSON.stringify({ title: cb.dataset.todo, done: cb.checked }) }).then((r) => r.json());
  render();
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "q") return;
  query = e.target.value; const pos = e.target.selectionStart;
  render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos);
});
// tooltips for chart marks
const tip = $("#tip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px";
});

// Refresh: every 5 s while something runs (only the status bar on form pages), every 30 s otherwise
let lastFull = 0;
async function tick() {
  try {
    await loadState();
    const busy = STATE.run?.running || Object.values(STATE.tasks || {}).some((t) => t.running);
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!FORM_VIEWS.has(view) && !typing && (busy || Date.now() - lastFull > 30e3)) { lastFull = Date.now(); await load(); }
    else if (view === "onboarding" && OB.step === 0 && !typing) renderOnboarding();
  } catch {}
  setTimeout(tick, STATE?.run?.running || Object.values(STATE?.tasks || {}).some((t) => t.running) ? 5000 : 30000);
}
load().then(() => { lastFull = Date.now(); setTimeout(tick, 5000); });
</script>
</body>
</html>
