<!doctype html>
<html lang="en" class="jp-mocha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Pilot</title>
<script>
  // Theme before first paint (same rule as js/theme.js): the saved choice, else the system setting
  (function () { var c = null; try { c = localStorage.getItem("jp-theme"); } catch (e) {}
    var dark = (c || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")) === "dark";
    document.documentElement.className = dark ? "jp-mocha" : "jp-latte"; })();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/app.css">
<link rel="stylesheet" href="/styles/jobs.css">
<link rel="stylesheet" href="/styles/resumes.css">
<link rel="stylesheet" href="/styles/insights.css">
<link rel="stylesheet" href="/styles/legacy.css">
</head>
<body class="jp-root">
<header class="jp-bar shell-bar" id="bar">
  <div class="jp-bar__brand"><span class="jp-bar__mark" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"></path></svg></span>Job Pilot</div>
  <nav class="jp-seg" id="nav" aria-label="Sections"></nav>
  <div class="jp-bar__status" id="runbar" role="status" aria-live="polite"></div>
  <div class="shell-tools">
    <div class="vsep" aria-hidden="true"></div>
    <button class="jp-btn jp-btn--tinted jp-btn--sm" type="button" data-action="ask-claude" aria-label="Ask Claude">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
      <span class="ask-label">Ask Claude</span>
    </button>
    <div class="menu-wrap">
      <button class="jp-btn jp-btn--sm" type="button" id="more-btn" data-action="more" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu"
        aria-label="More: Activity, Doctor, Settings" style="width: 28px; padding: 0">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>
      </button>
      <div class="menu" id="more-menu" role="menu" aria-label="More" hidden></div>
    </div>
  </div>
</header>
<main id="view" class="shell-main legacy"></main>
<div id="tip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
